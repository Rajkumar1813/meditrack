<header class="h-16 glass px-6 flex items-center justify-between gap-4 border-b border-slate-200 dark:border-slate-800 transition-colors duration-200">
  <div class="flex items-center gap-3">
    <h1 class="text-base font-semibold text-slate-800 dark:text-slate-100" id="admin-page-title">Dashboard</h1>
    <span class="text-xs px-2.5 py-0.5 rounded-full bg-primary-50 dark:bg-primary-950/40 text-primary-700 dark:text-primary-300 font-medium" data-brand="adminTagline">
      Inventory OS
    </span>
  </div>

  <!-- Top Bar Global Search -->
  <div class="hidden md:flex flex-1 max-w-md mx-4">
    <div class="relative w-full">
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      </div>
      <input
        type="search"
        id="admin-global-search"
        placeholder="Quick search inventory, medicines, batches..."
        class="w-full pl-9 pr-4 py-1.5 text-xs rounded-xl bg-slate-100/80 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-primary-500 text-slate-800 dark:text-slate-100 placeholder-slate-400 transition"
      />
    </div>
  </div>

  <div class="flex items-center gap-3">
    <!-- Lang Switcher -->
    <button id="admin-lang-toggle" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200 transition">
      <span data-i18n-active>हिन्दी</span>
    </button>

    <!-- Theme Switcher -->
    <button id="admin-theme-toggle" class="p-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
      <svg class="w-5 h-5 hidden dark:block text-amber-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"/></svg>
      <svg class="w-5 h-5 block dark:hidden text-slate-700" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/></svg>
    </button>

    <!-- Pharmacist / Admin profile pill -->
    <div class="flex items-center gap-2 pl-3 border-l border-slate-200 dark:border-slate-800">
      <div class="w-8 h-8 rounded-full bg-primary-100 dark:bg-primary-950/60 text-primary-700 dark:text-primary-300 font-semibold text-xs flex items-center justify-center">
        <span id="admin-user-initial">A</span>
      </div>
      <div class="hidden sm:block text-left">
        <div class="text-xs font-semibold text-slate-900 dark:text-slate-100" id="admin-user-name">Admin</div>
        <div class="text-[10px] text-slate-400 capitalize" id="admin-user-role">Owner</div>
      </div>
    </div>
  </div>
</header>
