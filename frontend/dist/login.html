<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="MediTrack - 100% genuine medicines, healthcare essentials, and doorstep prescription delivery from licensed pharmacies.">
<title>Login - MediTrack</title>
<link rel="icon" type="image/png" href="/assets/brand/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<!-- Pre-load brand defaults and apply anti-FOUC theme class -->
<script src="/js/brand.generated.js"></script>
<script>
  (function() {
    const saved = localStorage.getItem('meditrack_theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (saved === 'dark' || (!saved && prefersDark)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  })();
</script>


</head>
<body data-guard="guest" class="bg-canvas-light dark:bg-canvas-dark text-slate-800 dark:text-slate-100 min-h-screen flex flex-col font-sans transition-colors duration-200">
  <!-- Minimal Header -->
  <header class="h-16 flex items-center justify-between px-6 border-b border-slate-200/80 dark:border-slate-800/80 backdrop-blur-md bg-white/70 dark:bg-slate-900/70 sticky top-0 z-50">
    <a href="/index.html" class="flex items-center gap-2 group">
      <img data-brand-logo="full" src="/assets/brand/logo.svg" alt="MediTrack" class="h-7 w-auto transition-transform group-hover:scale-105">
    </a>
    <div class="flex items-center gap-2">
      <!-- Language Toggle -->
      <button id="lang-toggle" class="px-3 py-1.5 rounded-full border border-slate-200 dark:border-slate-700 text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
        <span id="current-lang-label">EN</span>
      </button>

      <!-- Theme Toggle -->
      <button id="theme-toggle" aria-label="Toggle theme" class="p-2 rounded-full border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
        <svg class="w-4 h-4 hidden dark:block text-amber-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"/></svg>
        <svg class="w-4 h-4 block dark:hidden text-slate-700" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/></svg>
      </button>
    </div>
  </header>

  <!-- Login Main Container with 3D Background Perspective -->
  <main class="flex-1 flex items-center justify-center p-4 sm:p-6 md:p-12 relative overflow-hidden">
    <!-- Ambient subtle background decorative orbs -->
    <div class="absolute -top-32 -left-32 w-80 h-80 rounded-full bg-primary-500/10 dark:bg-primary-500/5 blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-32 -right-32 w-80 h-80 rounded-full bg-emerald-500/10 dark:bg-emerald-500/5 blur-3xl pointer-events-none"></div>

    <!-- 3D Card -->
    <div class="max-w-md w-full bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl border border-slate-200/80 dark:border-slate-800 rounded-3xl p-8 shadow-2xl card-3d relative z-10 transition-transform duration-100 ease-out">
      
      <!-- Card Header -->
      <div class="text-center mb-6">
        <div class="inline-flex p-3 rounded-2xl bg-primary-50 dark:bg-primary-950/60 text-primary-600 dark:text-primary-400 mb-3 shadow-inner">
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
        </div>
        <h2 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white" data-i18n="login">Login</h2>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
          Quick & secure access via One-Time Password
        </p>
      </div>

      <!-- Mode Selector Tabs -->
      <div class="flex p-1 bg-slate-100 dark:bg-slate-800/70 rounded-2xl mb-6 text-xs font-semibold">
        <button type="button" id="tab-phone" class="flex-1 py-2 rounded-xl transition-all duration-200 bg-white dark:bg-slate-800 shadow-sm text-slate-900 dark:text-white flex items-center justify-center gap-1.5">
          <svg class="w-3.5 h-3.5 text-primary-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
          Mobile Number
        </button>
        <button type="button" id="tab-email" class="flex-1 py-2 rounded-xl transition-all duration-200 text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 flex items-center justify-center gap-1.5">
          <svg class="w-3.5 h-3.5 text-primary-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          Email Address
        </button>
      </div>

      <!-- Rate Limit Alert Banner -->
      <div id="rate-limit-banner" class="hidden mb-4 p-3 bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-900/50 rounded-2xl flex items-center gap-2.5 text-xs text-amber-800 dark:text-amber-200">
        <svg class="w-4 h-4 text-amber-600 flex-shrink-0 animate-spin" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>Rate limit reached. Try again in <strong id="rate-limit-seconds" class="font-mono">60s</strong></span>
      </div>

      <!-- Error Alert Message Container -->
      <div id="login-error-message" class="hidden mb-4 p-3 bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-900/50 rounded-2xl text-xs text-red-700 dark:text-red-300"></div>

      <!-- STEP 1: Identifier Input Form -->
      <form id="otp-request-form" class="space-y-4">
        <div>
          <label for="login-identifier" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
            Your Credential
          </label>
          <div class="relative flex items-center">
            <span id="phone-prefix" class="absolute left-3.5 text-xs font-semibold text-slate-500 pointer-events-none">+91</span>
            <input
              type="tel"
              id="login-identifier"
              required
              placeholder="98765 43210"
              class="w-full pl-12 pr-4 py-3 rounded-2xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 placeholder-slate-400 text-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition shadow-sm"
            >
          </div>
        </div>

        <button
          type="submit"
          id="send-otp-btn"
          class="w-full py-3.5 rounded-2xl bg-primary-600 hover:bg-primary-700 active:scale-[0.99] text-white font-semibold text-sm transition shadow-lg shadow-primary-600/25 flex items-center justify-center gap-2"
          data-i18n="sendOtp"
        >
          <span>Send OTP</span>
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        </button>
      </form>

      <!-- STEP 2: OTP Verification Form -->
      <form id="otp-verify-form" class="space-y-5 hidden">
        <!-- Sent Target Pill -->
        <div class="p-3 bg-slate-50 dark:bg-slate-800/80 border border-slate-200/80 dark:border-slate-700 rounded-2xl text-xs text-slate-700 dark:text-slate-300 flex justify-between items-center">
          <span id="sent-target-label" class="font-medium truncate">Code sent</span>
          <button type="button" id="change-identifier-btn" class="font-semibold text-primary-600 dark:text-primary-400 hover:underline ml-2 flex-shrink-0">
            Change
          </button>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-2.5 text-center">
            Enter 6-digit verification code
          </label>
          <!-- 6 Individual Digit Boxes -->
          <div class="grid grid-cols-6 gap-2">
            <input type="text" id="otp-digit-0" inputmode="numeric" maxlength="1" class="w-full h-13 text-center text-xl font-bold font-mono rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition shadow-sm">
            <input type="text" id="otp-digit-1" inputmode="numeric" maxlength="1" class="w-full h-13 text-center text-xl font-bold font-mono rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition shadow-sm">
            <input type="text" id="otp-digit-2" inputmode="numeric" maxlength="1" class="w-full h-13 text-center text-xl font-bold font-mono rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition shadow-sm">
            <input type="text" id="otp-digit-3" inputmode="numeric" maxlength="1" class="w-full h-13 text-center text-xl font-bold font-mono rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition shadow-sm">
            <input type="text" id="otp-digit-4" inputmode="numeric" maxlength="1" class="w-full h-13 text-center text-xl font-bold font-mono rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition shadow-sm">
            <input type="text" id="otp-digit-5" inputmode="numeric" maxlength="1" class="w-full h-13 text-center text-xl font-bold font-mono rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-800 text-slate-900 dark:text-white focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition shadow-sm">
          </div>
        </div>

        <button
          type="submit"
          id="verify-otp-btn"
          class="w-full py-3.5 rounded-2xl bg-primary-600 hover:bg-primary-700 active:scale-[0.99] text-white font-semibold text-sm transition shadow-lg shadow-primary-600/25 flex items-center justify-center gap-2"
          data-i18n="verifyOtp"
        >
          <span>Verify & Login</span>
        </button>

        <div class="text-center text-xs text-slate-500 dark:text-slate-400 pt-1">
          <span id="resend-timer-text">Resend code in 60s</span>
          <button type="button" id="resend-otp-btn" class="hidden text-primary-600 dark:text-primary-400 font-semibold hover:underline" data-i18n="resendOtp">
            Resend OTP
          </button>
        </div>
      </form>
    </div>
  </main>

  <!-- Scripts -->
  <script type="module" src="/js/app.js"></script>
  <script type="module" src="/js/store/login.js"></script>
</body>
</html>
