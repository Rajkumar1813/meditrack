<!DOCTYPE html>
<html lang="en">
<head>
  <!-- @include partials/head.html -->
</head>
<body class="bg-canvas-light dark:bg-canvas-dark text-slate-800 dark:text-slate-100 min-h-screen flex flex-col font-sans transition-colors duration-200">
  <!-- @include partials/header.html -->

  <!-- Cart Main -->
  <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full pb-24 sm:pb-12">

    <!-- Page Header -->
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight" data-i18n="cart">
          Shopping Cart
        </h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Review medicines and health essentials before checkout</p>
      </div>

      <button
        id="clear-cart-btn"
        type="button"
        class="text-xs text-red-500 hover:text-red-700 font-semibold transition"
      >
        Clear Cart
      </button>
    </div>

    <!-- Empty Cart State -->
    <div id="empty-cart-state" class="hidden py-16 text-center">
      <div class="w-20 h-20 rounded-3xl bg-slate-100 dark:bg-slate-800 text-slate-400 flex items-center justify-center mx-auto mb-4 text-3xl shadow-soft">
        🛒
      </div>
      <h2 class="text-xl font-bold text-slate-900 dark:text-white mb-2" data-i18n="emptyCart">
        Your Cart is Empty
      </h2>
      <p class="text-xs text-slate-500 dark:text-slate-400 max-w-sm mx-auto mb-6">
        Looks like you haven't added any medicines yet. Explore our verified pharmacy catalog.
      </p>
      <a
        href="/catalog.html"
        class="px-6 py-3 rounded-full bg-primary-600 hover:bg-primary-700 text-white font-bold text-xs shadow-soft transition inline-block"
        data-i18n="catalog"
      >
        Browse Medicines
      </a>
    </div>

    <!-- Cart Items & Summary Grid -->
    <div id="cart-content-section" class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">
      <!-- Items Container -->
      <section class="lg:col-span-2 space-y-3" id="cart-items-container">
        <!-- Rendered by cart.js -->
        <div class="h-28 rounded-2xl bg-slate-200 dark:bg-slate-800 skeleton-shimmer"></div>
        <div class="h-28 rounded-2xl bg-slate-200 dark:bg-slate-800 skeleton-shimmer"></div>
      </section>

      <!-- Sticky Order Summary Container -->
      <aside class="lg:col-span-1" id="cart-summary-container">
        <!-- Rendered by cart.js -->
      </aside>
    </div>

  </main>

  <!-- @include partials/bottom-nav.html -->
  <!-- @include partials/footer.html -->

  <!-- App Bootstrap & Cart Store JS -->
  <script type="module" src="/js/app.js"></script>
  <script type="module" src="/js/store/cart.js"></script>
</body>
</html>
