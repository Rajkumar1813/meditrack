<!DOCTYPE html>
<html lang="en">
<head>
  <!-- @include partials/head.html -->
</head>
<body data-guard="auth" class="bg-canvas-light dark:bg-canvas-dark text-slate-800 dark:text-slate-100 min-h-screen flex flex-col font-sans transition-colors duration-200">
  <!-- @include partials/header.html -->

  <!-- Notifications Main -->
  <main class="flex-1 max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full pb-24 sm:pb-12">

    <!-- Header & Controls -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
      <div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight" data-i18n="notifications">
          Notification Inbox
        </h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
          Real-time alerts for orders, pharmacist prescription reviews, and smart refill reminders
        </p>
      </div>

      <div class="flex items-center gap-3">
        <!-- Filter Tabs: All / Unread -->
        <div class="flex items-center p-1 rounded-2xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
          <button
            id="notif-filter-all"
            type="button"
            class="px-3.5 py-1.5 rounded-xl bg-white dark:bg-slate-800 text-primary-600 dark:text-primary-400 font-bold text-xs shadow-sm transition"
          >
            All
          </button>
          <button
            id="notif-filter-unread"
            type="button"
            class="px-3.5 py-1.5 rounded-xl text-slate-500 hover:text-slate-700 dark:hover:text-slate-300 font-medium text-xs transition"
          >
            Unread
          </button>
        </div>

        <button
          id="mark-all-read-btn"
          type="button"
          class="text-xs font-semibold text-primary-600 hover:text-primary-700 transition"
          data-i18n="markAllRead"
        >
          Mark all read
        </button>
      </div>
    </div>

    <!-- Empty State -->
    <div id="notifications-empty-state" class="hidden py-16 text-center">
      <div class="w-16 h-16 rounded-3xl bg-slate-100 dark:bg-slate-800 text-slate-400 flex items-center justify-center mx-auto mb-4 text-2xl shadow-soft">
        🔔
      </div>
      <h2 class="text-lg font-bold text-slate-900 dark:text-white mb-1" data-i18n="noNotifications">
        No notifications right now
      </h2>
      <p class="text-xs text-slate-500 dark:text-slate-400 max-w-sm mx-auto">
        When your orders update or pharmacist reviews your prescription, updates will appear here.
      </p>
    </div>

    <!-- Notifications List Container -->
    <section id="notifications-list-container" class="space-y-3">
      <!-- Loading Skeletons -->
      <div class="h-20 rounded-2xl bg-slate-200 dark:bg-slate-800 skeleton-shimmer"></div>
      <div class="h-20 rounded-2xl bg-slate-200 dark:bg-slate-800 skeleton-shimmer"></div>
    </section>

    <!-- Cursor Load More Button -->
    <div class="mt-8 text-center">
      <button
        id="notif-load-more-btn"
        type="button"
        class="hidden px-6 py-2.5 rounded-full border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-xs font-semibold text-slate-700 dark:text-slate-200 hover:bg-slate-50 shadow-sm transition"
      >
        Load Older Notifications
      </button>
    </div>

  </main>

  <!-- @include partials/bottom-nav.html -->
  <!-- @include partials/footer.html -->

  <!-- App Bootstrap & Notifications Store JS -->
  <script type="module" src="/js/app.js"></script>
  <script type="module" src="/js/store/notifications.js"></script>
</body>
</html>
