name: meditrack
description: "MediTrack Online Pharmacy & Inventory OS Mobile Client"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  connectivity_plus: ^7.3.2
  google_fonts: ^8.2.1
  intl: 0.20.2
  flutter_local_notifications: ^22.3.3
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.14.1
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/brand/
