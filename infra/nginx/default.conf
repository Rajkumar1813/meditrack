server {
    listen 80;
    server_name localhost;
    server_tokens off;

    # Global Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' http://localhost:8080 http://127.0.0.1:8080 https://api.razorpay.com; frame-ancestors 'none';" always;

    # Backend API & Webhooks (Nginx reverse proxy to PHP-FPM)
    location ^~ /api/ {
        fastcgi_pass php-fpm:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param DOCUMENT_URI $document_uri;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    location ^~ /webhooks/ {
        fastcgi_pass php-fpm:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param DOCUMENT_URI $document_uri;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    location = /health {
        fastcgi_pass php-fpm:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param DOCUMENT_URI $document_uri;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    # Block access to hidden files and dotfiles (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Frontend Static Files
    location / {
        root /var/www/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Static brand assets with immutable caching
    location ^~ /assets/brand/ {
        root /var/www/frontend/dist;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Gzip Compression for text, JSON, and JS assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    client_max_body_size 10M;
}
