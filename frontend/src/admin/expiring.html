<!DOCTYPE html>
<html lang="en">
<head>
  <!-- @include partials/head.html -->
</head>
<body data-guard="auth" data-roles="admin,pharmacist,staff" class="bg-canvas-light dark:bg-canvas-dark text-slate-800 dark:text-slate-100 min-h-screen flex font-sans transition-colors duration-200">
  <!-- @include partials/admin-sidebar.html -->

  <div class="flex-1 flex flex-col min-w-0">
    <!-- @include partials/admin-topbar.html -->

    <main class="flex-1 p-6 max-w-7xl w-full mx-auto space-y-6">
      <!-- Header -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <h1 class="text-xl font-bold text-slate-900 dark:text-white" data-i18n="expiringSoon">Expiring Soon</h1>
          <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
            Identify near-expiry inventory batches to prioritize dispensing (FEFO) or return to distributors.
          </p>
        </div>

        <!-- 30d vs 90d Tabs -->
        <div class="flex items-center p-1 bg-slate-100 dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700">
          <button id="tab-30d" class="px-4 py-1.5 text-xs font-bold rounded-lg bg-white dark:bg-slate-900 text-orange-600 dark:text-orange-400 shadow-sm transition">
            Expiring in 30 Days
          </button>
          <button id="tab-90d" class="px-4 py-1.5 text-xs font-semibold rounded-lg text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition">
            Expiring in 90 Days
          </button>
        </div>
      </div>

      <!-- Expiring Batches Table -->
      <section class="rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-soft overflow-hidden">
        <div class="overflow-x-auto">
          <table class="w-full text-left text-xs">
            <thead class="bg-slate-50 dark:bg-slate-800/50 text-[11px] font-semibold text-slate-500 dark:text-slate-400 border-b border-slate-200 dark:border-slate-800">
              <tr>
                <th class="py-3.5 px-4 font-semibold">Medicine / Generic</th>
                <th class="py-3.5 px-4 font-semibold">Batch No</th>
                <th class="py-3.5 px-4 font-semibold">Expiry Date</th>
                <th class="py-3.5 px-4 font-semibold">Days Left</th>
                <th class="py-3.5 px-4 font-semibold text-right">Units Remaining</th>
                <th class="py-3.5 px-4 font-semibold">Rack / Shelf</th>
                <th class="py-3.5 px-4 font-semibold text-right">Action</th>
              </tr>
            </thead>
            <tbody id="expiring-table-body" class="divide-y divide-slate-100 dark:divide-slate-800/60">
              <tr>
                <td colspan="7" class="p-8 text-center text-slate-400">Loading expiring inventory...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="/js/app.js"></script>
  <script type="module" src="/js/admin/expiring.js"></script>
</body>
</html>
