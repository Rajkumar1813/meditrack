<!DOCTYPE html>
<html lang="en">
<head>
  <!-- @include partials/head.html -->
</head>
<body class="bg-canvas-light dark:bg-canvas-dark text-slate-800 dark:text-slate-100 min-h-screen flex flex-col font-sans transition-colors duration-200">
  <!-- @include partials/header.html -->

  <!-- Hero Section -->
  <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full pb-20 sm:pb-8">
    <section class="rounded-3xl p-8 sm:p-12 mb-8 bg-gradient-to-r from-primary-600 to-primary-800 text-white shadow-lift relative overflow-hidden">
      <div class="relative z-10 max-w-2xl">
        <span class="inline-block px-3 py-1 rounded-full bg-white/20 text-white text-xs font-semibold backdrop-blur-md mb-4" data-brand="tagline">
          Your Trusted Online Pharmacy
        </span>
        <h1 class="text-3xl sm:text-5xl font-bold tracking-tight mb-4">
          Genuine Medicines Delivered Fast
        </h1>
        <p class="text-white/80 text-sm sm:text-base leading-relaxed mb-6">
          Order 100% verified medicines, healthcare products, and schedule refills directly from licensed pharmacies.
        </p>
        <div class="flex flex-wrap gap-3">
          <a href="/catalog.html" class="px-6 py-3 rounded-full bg-white text-primary-700 font-semibold text-sm hover:bg-slate-100 transition shadow-sm" data-i18n="catalog">
            Browse Catalog
          </a>
          <a href="/upload-rx.html" class="px-6 py-3 rounded-full bg-primary-700 text-white font-semibold text-sm hover:bg-primary-900 border border-white/20 transition">
            Upload Prescription
          </a>
        </div>
      </div>
      <!-- Decorative circle -->
      <div class="absolute -right-16 -bottom-16 w-80 h-80 rounded-full bg-white/10 blur-2xl pointer-events-none"></div>
    </section>

    <!-- Categories Placeholder -->
    <section class="mb-10">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-bold text-slate-900 dark:text-white" data-i18n="filterCategory">Categories</h2>
        <a href="/catalog.html" class="text-xs font-semibold text-primary-600 hover:text-primary-700">View All &rarr;</a>
      </div>
      <div id="category-chips-container" class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-3">
        <!-- Rendered by JS or Skeleton -->
        <div class="h-20 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-3 flex flex-col items-center justify-center card-3d">
          <span class="text-xs font-medium">Tablet</span>
        </div>
        <div class="h-20 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-3 flex flex-col items-center justify-center card-3d">
          <span class="text-xs font-medium">Syrup</span>
        </div>
        <div class="h-20 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-3 flex flex-col items-center justify-center card-3d">
          <span class="text-xs font-medium">Injection</span>
        </div>
        <div class="h-20 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-3 flex flex-col items-center justify-center card-3d">
          <span class="text-xs font-medium">Ointment</span>
        </div>
        <div class="h-20 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-3 flex flex-col items-center justify-center card-3d">
          <span class="text-xs font-medium">Capsule</span>
        </div>
        <div class="h-20 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-3 flex flex-col items-center justify-center card-3d">
          <span class="text-xs font-medium">Drops</span>
        </div>
        <div class="h-20 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-3 flex flex-col items-center justify-center card-3d">
          <span class="text-xs font-medium">Inhaler</span>
        </div>
        <div class="h-20 rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-3 flex flex-col items-center justify-center card-3d">
          <span class="text-xs font-medium">Powder</span>
        </div>
      </div>
    </section>
  </main>

  <!-- @include partials/bottom-nav.html -->
  <!-- @include partials/footer.html -->

  <!-- App Bootstrap JS -->
  <script type="module" src="/js/app.js"></script>

</html>
