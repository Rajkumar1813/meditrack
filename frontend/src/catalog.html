<!DOCTYPE html>
<html lang="en">
<head>
  <!-- @include partials/head.html -->
</head>
<body class="bg-canvas-light dark:bg-canvas-dark text-slate-800 dark:text-slate-100 min-h-screen flex flex-col font-sans transition-colors duration-200">
  <!-- @include partials/header.html -->

  <!-- Catalog Main -->
  <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full pb-24 sm:pb-12">

    <!-- Page Header & Search Bar -->
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
      <div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight" data-i18n="catalog">
          Medicine Catalog
        </h1>
        <p id="catalog-count-indicator" class="text-xs text-slate-500 dark:text-slate-400 mt-1">
          Loading medicines...
        </p>
      </div>

      <!-- Controls: Mobile Filter Trigger, Sort, View Toggle -->
      <div class="flex items-center gap-2 sm:gap-3 flex-wrap">
        <!-- Mobile Filters Button -->
        <button
          id="open-filters-btn"
          type="button"
          class="lg:hidden px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-xs font-semibold text-slate-700 dark:text-slate-200 flex items-center gap-2 hover:bg-slate-50 shadow-sm"
        >
          <svg class="w-4 h-4 text-primary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/></svg>
          <span data-i18n="filters">Filters</span>
        </button>

        <!-- Sort Select -->
        <div class="relative">
          <label for="catalog-sort-select" class="sr-only">Sort By</label>
          <select
            id="catalog-sort-select"
            class="px-3 py-2 pr-8 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 text-xs font-medium text-slate-700 dark:text-slate-200 outline-none focus:border-primary-500 shadow-sm appearance-none cursor-pointer"
          >
            <option value="name_asc" data-i18n="nameAsc">Name: A to Z</option>
            <option value="price_asc" data-i18n="priceLowToHigh">Price: Low to High</option>
            <option value="price_desc" data-i18n="priceHighToLow">Price: High to Low</option>
            <option value="relevance">Relevance</option>
          </select>
          <span class="absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
          </span>
        </div>

        <!-- Grid/List View Toggle (Desktop) -->
        <div class="hidden sm:flex items-center p-1 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700">
          <button
            id="view-toggle-grid"
            type="button"
            class="p-1.5 rounded-lg bg-white dark:bg-slate-900 text-primary-600 shadow-sm transition"
            aria-label="Grid View"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
          </button>
          <button
            id="view-toggle-list"
            type="button"
            class="p-1.5 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition"
            aria-label="List View"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Layout Grid: Sidebar Filters (Desktop) + Products Area -->
    <div class="grid grid-cols-1 lg:grid-cols-4 gap-8 items-start">

      <!-- Desktop Filter Sidebar -->
      <aside class="hidden lg:block bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-soft sticky top-20">
        <div class="flex items-center justify-between pb-4 mb-4 border-b border-slate-100 dark:border-slate-800">
          <h2 class="text-sm font-bold text-slate-900 dark:text-white uppercase tracking-wider" data-i18n="filters">Filters</h2>
          <button id="clear-filters-btn" type="button" class="text-xs text-primary-600 hover:text-primary-700 font-semibold" data-i18n="clearFilters">Clear All</button>
        </div>

        <div class="space-y-5">
          <!-- Live Search Filter -->
          <div>
            <label for="catalog-search-input" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-2">Search Query</label>
            <input
              type="text"
              id="catalog-search-input"
              placeholder="Filter by name/salt..."
              class="w-full px-3 py-2 rounded-xl text-xs border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:bg-white dark:focus:bg-slate-900 outline-none focus:border-primary-500 transition"
            >
          </div>

          <!-- Category Filter -->
          <div>
            <label for="filter-category" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-2" data-i18n="filterCategory">Dosage Form</label>
            <select
              id="filter-category"
              class="w-full px-3 py-2 rounded-xl text-xs border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 outline-none focus:border-primary-500 transition cursor-pointer"
            >
              <option value="">All Categories</option>
            </select>
          </div>

          <!-- Prescription Type Filter -->
          <div>
            <label for="filter-rx" class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-2">Prescription Type</label>
            <select
              id="filter-rx"
              class="w-full px-3 py-2 rounded-xl text-xs border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 outline-none focus:border-primary-500 transition cursor-pointer"
            >
              <option value="">All Medicines</option>
              <option value="0">Over-the-Counter (OTC)</option>
              <option value="1">Prescription Only (Rx)</option>
            </select>
          </div>

          <!-- In Stock Only -->
          <div class="pt-2 border-t border-slate-100 dark:border-slate-800">
            <label class="flex items-center gap-2.5 cursor-pointer">
              <input
                type="checkbox"
                id="filter-stock"
                checked
                class="w-4 h-4 rounded border-slate-300 text-primary-600 focus:ring-primary-500"
              >
              <span class="text-xs font-medium text-slate-700 dark:text-slate-300">In Stock Only</span>
            </label>
          </div>
        </div>
      </aside>

      <!-- Products Grid & Pagination -->
      <section class="lg:col-span-3">
        <!-- Products Grid Container -->
        <div id="catalog-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 sm:gap-6 min-h-[400px]">
          <!-- Populated by catalog.js -->
        </div>

        <!-- Pagination Controls -->
        <nav class="mt-10 pt-6 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between" aria-label="Catalog Pagination">
          <button
            id="pagination-prev"
            type="button"
            disabled
            class="px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-800 text-xs font-semibold text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800 disabled:opacity-40 disabled:cursor-not-allowed transition flex items-center gap-1.5"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            <span>Previous</span>
          </button>

          <span id="pagination-page-indicator" class="text-xs font-medium text-slate-500 dark:text-slate-400">
            Page 1
          </span>

          <button
            id="pagination-next"
            type="button"
            disabled
            class="px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-800 text-xs font-semibold text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800 disabled:opacity-40 disabled:cursor-not-allowed transition flex items-center gap-1.5"
          >
            <span>Next</span>
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
          </button>
        </nav>
      </section>

    </div>

  </main>

  <!-- Mobile Filter Dialog Drawer (Native Accessible <dialog>) -->
  <dialog id="filter-drawer" class="fixed inset-0 m-0 w-full max-w-sm h-full max-h-none bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 p-6 shadow-2xl backdrop:bg-black/50 z-50 overflow-y-auto">
    <div class="flex items-center justify-between pb-4 border-b border-slate-100 dark:border-slate-800 mb-6">
      <h3 class="text-base font-bold" data-i18n="filters">Filter Catalog</h3>
      <button id="close-filters-btn" type="button" class="p-2 text-slate-400 hover:text-slate-600 text-xl font-bold leading-none">&times;</button>
    </div>

    <div class="space-y-6">
      <div>
        <label for="mobile-filter-category" class="block text-xs font-semibold mb-2" data-i18n="filterCategory">Category</label>
        <select id="mobile-filter-category" class="w-full px-3 py-2.5 rounded-xl text-sm border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800">
          <option value="">All Categories</option>
        </select>
      </div>

      <div>
        <label for="mobile-filter-rx" class="block text-xs font-semibold mb-2">Prescription Type</label>
        <select id="mobile-filter-rx" class="w-full px-3 py-2.5 rounded-xl text-sm border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800">
          <option value="">All Medicines</option>
          <option value="0">Over-the-Counter (OTC)</option>
          <option value="1">Prescription Only (Rx)</option>
        </select>
      </div>

      <div>
        <label class="flex items-center gap-3 cursor-pointer">
          <input type="checkbox" id="mobile-filter-stock" checked class="w-4 h-4 rounded text-primary-600 focus:ring-primary-500">
          <span class="text-sm font-medium">In Stock Only</span>
        </label>
      </div>

      <div class="pt-4 border-t border-slate-100 dark:border-slate-800 flex gap-3">
        <button id="apply-drawer-filters-btn" type="button" class="flex-1 py-3 rounded-full bg-primary-600 text-white font-bold text-sm shadow-sm hover:bg-primary-700 transition" data-i18n="applyFilters">
          Apply Filters
        </button>
      </div>
    </div>
  </dialog>

  <!-- @include partials/bottom-nav.html -->
  <!-- @include partials/footer.html -->

  <!-- App Bootstrap & Catalog Store JS -->
  <script type="module" src="/js/app.js"></script>
  <script type="module" src="/js/store/catalog.js"></script>
</body>
</html>
