<!DOCTYPE html>
<html lang="en">
<head>
  <!-- @include partials/head.html -->
</head>
<body data-guard="auth" class="bg-canvas-light dark:bg-canvas-dark text-slate-800 dark:text-slate-100 min-h-screen flex flex-col font-sans transition-colors duration-200">
  <!-- @include partials/header.html -->

  <!-- Orders Main -->
  <main class="flex-1 max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full pb-24 sm:pb-12">

    <!-- Header -->
    <div class="mb-6">
      <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight" data-i18n="orders">
        My Orders
      </h1>
      <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
        Track current deliveries, view order timelines, and download tax invoices
      </p>
    </div>

    <!-- Empty State -->
    <div id="orders-empty-state" class="hidden py-16 text-center">
      <div class="w-20 h-20 rounded-3xl bg-slate-100 dark:bg-slate-800 text-slate-400 flex items-center justify-center mx-auto mb-4 text-3xl shadow-soft">
        📦
      </div>
      <h2 class="text-xl font-bold text-slate-900 dark:text-white mb-2" data-i18n="noOrders">
        No Orders Yet
      </h2>
      <p class="text-xs text-slate-500 dark:text-slate-400 max-w-sm mx-auto mb-6">
        When you place orders for medicines or health essentials, they will appear here.
      </p>
      <a
        href="/catalog.html"
        class="px-6 py-3 rounded-full bg-primary-600 hover:bg-primary-700 text-white font-bold text-xs shadow-soft transition inline-block"
        data-i18n="catalog"
      >
        Start Shopping
      </a>
    </div>

    <!-- Orders Cards Container -->
    <section id="orders-list-container" class="space-y-4">
      <!-- Loading Skeletons -->
      <div class="h-44 rounded-3xl bg-slate-200 dark:bg-slate-800 skeleton-shimmer"></div>
      <div class="h-44 rounded-3xl bg-slate-200 dark:bg-slate-800 skeleton-shimmer"></div>
    </section>

    <!-- Cursor Load More Button -->
    <div class="mt-8 text-center">
      <button
        id="orders-load-more-btn"
        type="button"
        class="hidden px-6 py-2.5 rounded-full border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-xs font-semibold text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800 shadow-sm transition"
      >
        Load More Orders
      </button>
    </div>

  </main>

  <!-- @include partials/bottom-nav.html -->
  <!-- @include partials/footer.html -->

  <!-- App Bootstrap & Orders Store JS -->
  <script type="module" src="/js/app.js"></script>
  <script type="module" src="/js/store/orders.js"></script>
</body>
</html>
