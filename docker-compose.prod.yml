services:
  nginx:
    image: nginx:1.25-alpine
    container_name: meditrack-prod-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend/dist:/var/www/frontend/dist:ro
      - ./backend:/var/www/backend:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/ssl:/etc/nginx/ssl:ro
    depends_on:
      php-fpm:
        condition: service_healthy
    networks:
      - meditrack-prod-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  php-fpm:
    build:
      context: ./infra/php
      dockerfile: Dockerfile
    container_name: meditrack-prod-php
    restart: always
    volumes:
      - ./backend:/var/www/backend:ro
      - meditrack-prod-storage:/var/www/backend/storage
      - ./infra/php/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-meditrack}
      DB_USERNAME: ${DB_USERNAME:-meditrack_user}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://meditrack.in}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/health.php SCRIPT_FILENAME=/var/www/backend/public/index.php REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - meditrack-prod-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  mysql:
    image: mysql:8.0
    container_name: meditrack-prod-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-meditrack}
      MYSQL_USER: ${DB_USERNAME:-meditrack_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - meditrack-prod-mysql-data:/var/lib/mysql
    networks:
      - meditrack-prod-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: meditrack-prod-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - meditrack-prod-redis-data:/data
    networks:
      - meditrack-prod-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    build:
      context: ./infra/php
      dockerfile: Dockerfile
    container_name: meditrack-prod-worker
    restart: always
    command: ["php", "/var/www/backend/bin/worker.php"]
    volumes:
      - ./backend:/var/www/backend:ro
      - meditrack-prod-storage:/var/www/backend/storage
      - ./infra/php/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: mysql
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      php-fpm:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - meditrack-prod-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  scheduler:
    build:
      context: ./infra/php
      dockerfile: Dockerfile
    container_name: meditrack-prod-scheduler
    restart: always
    command: ["sh", "-c", "while true; do php /var/www/backend/bin/schedule.php; sleep 60; done"]
    volumes:
      - ./backend:/var/www/backend:ro
      - meditrack-prod-storage:/var/www/backend/storage
      - ./infra/php/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: mysql
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      php-fpm:
        condition: service_healthy
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    networks:
      - meditrack-prod-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  meditrack-prod-mysql-data:
  meditrack-prod-redis-data:
  meditrack-prod-storage:

networks:
  meditrack-prod-net:
    driver: bridge

