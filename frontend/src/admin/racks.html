<!DOCTYPE html>
<html lang="en">
<head>
  <!-- @include partials/head.html -->
</head>
<body data-guard="auth" data-roles="admin,pharmacist,staff" class="bg-canvas-light dark:bg-canvas-dark text-slate-800 dark:text-slate-100 min-h-screen flex font-sans transition-colors duration-200">
  <!-- @include partials/admin-sidebar.html -->

  <div class="flex-1 flex flex-col min-w-0">
    <!-- @include partials/admin-topbar.html -->

    <main class="flex-1 p-6 max-w-7xl w-full mx-auto space-y-6">
      <!-- Header -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <h1 class="text-xl font-bold text-slate-900 dark:text-white" data-i18n="locations">Pharmacy Racks & Shelves</h1>
          <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
            Physical layout tracking for quick medicine picking and batch stocking.
          </p>
        </div>

        <div class="flex items-center gap-2.5">
          <button id="btn-add-rack" class="px-3.5 py-2 text-xs font-bold rounded-xl bg-primary-600 hover:bg-primary-700 text-white shadow-lift transition flex items-center gap-1.5">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            Add Rack
          </button>
        </div>
      </div>

      <!-- Racks Grid -->
      <section id="racks-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="col-span-full text-center py-12 text-slate-400 text-xs">Loading racks and storage locations...</div>
      </section>
    </main>
  </div>

  <!-- Add Rack Modal -->
  <div id="rack-modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl max-w-md w-full p-6 shadow-2xl">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
        <h3 class="text-base font-bold text-slate-900 dark:text-white" id="rack-modal-title">Add Storage Rack</h3>
        <button id="btn-close-rack-modal" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <form id="form-rack" class="space-y-4 pt-4 text-xs">
        <input type="hidden" id="rack-id" />
        <div>
          <label class="block font-medium text-slate-700 dark:text-slate-300 mb-1">Rack Name / Code *</label>
          <input type="text" id="rack-name" required placeholder="e.g. Rack A1" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700" />
        </div>
        <div>
          <label class="block font-medium text-slate-700 dark:text-slate-300 mb-1">Zone / Room</label>
          <input type="text" id="rack-zone" placeholder="e.g. Front Counter, Cold Storage" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700" />
        </div>
        <div>
          <label class="block font-medium text-slate-700 dark:text-slate-300 mb-1">Max Capacity (Boxes/Units)</label>
          <input type="number" id="rack-capacity" min="1" value="200" class="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700" />
        </div>

        <div class="flex items-center justify-end gap-3 pt-2">
          <button type="button" id="btn-cancel-rack" class="px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 font-semibold text-slate-700 dark:text-slate-300 hover:bg-slate-100 transition">
            Cancel
          </button>
          <button type="submit" class="px-5 py-2 rounded-xl bg-primary-600 hover:bg-primary-700 text-white font-bold shadow-lift transition">
            Save Rack
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Medicines In Rack Drawer -->
  <div id="rack-medicines-drawer" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden flex justify-end">
    <div class="bg-white dark:bg-slate-900 w-full max-w-lg h-full shadow-2xl flex flex-col border-l border-slate-200 dark:border-slate-800">
      <div class="p-5 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
        <div>
          <h3 class="text-base font-bold text-slate-900 dark:text-white" id="drawer-rack-title">Medicines in Rack</h3>
          <p class="text-xs text-slate-400">Inventory batches stored in this location</p>
        </div>
        <button id="btn-close-rack-drawer" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="flex-1 overflow-y-auto p-4 space-y-3" id="rack-medicines-container"></div>
    </div>
  </div>

  <script type="module" src="/js/app.js"></script>
  <script type="module" src="/js/admin/racks.js"></script>
</body>
</html>
